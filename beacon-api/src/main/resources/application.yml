# 服务名称
spring:
  application:
    name: beacon-api
  # 多环境
  profiles:
    active: dev
  # 导入nacos配置中心（Spring Boot 2.4+ 必须显式声明）
  config:
    import:
      - optional:nacos:beacon-api-dev.yml
  # nacos注册中心地址
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.88.130:8848
      # nacos配置中心地址:
      config:
        server-addr: 192.168.88.130:8848
        file-extension: yml
        # beacon-api-dev.yml